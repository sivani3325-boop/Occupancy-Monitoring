<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Library · Live Seat Monitor</title>
  <!-- Google Font & Firebase SDK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #090c15;
      --bg-surface: #111827;
      --bg-card: #1a2235;
      --border-subtle: #2a354b;
      --text-primary: #f0f4ff;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-green-glow: #34d399;
      --accent-red: #ef4444;
      --accent-red-glow: #f87171;
      --shadow-card: 0 20px 35px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    body {
      background: radial-gradient(circle at 20% 10%, #1a2337 0%, #090c15 80%);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .dashboard {
      max-width: 1100px;
      width: 100%;
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 2.75rem;
      padding: 2.25rem 2.25rem 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: var(--shadow-card), 0 0 0 1px rgba(59, 130, 246, 0.1) inset;
    }

    /* ---------- HEADER ---------- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .brand h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand h1 .pulse-dot {
      width: 12px;
      height: 12px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 18px var(--accent-green-glow);
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
      100% { opacity: 0.8; transform: scale(1); }
    }

    .brand .sub {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.3rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 400;
    }

    .live-tag {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green-glow);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      backdrop-filter: blur(4px);
    }

    .live-tag::before {
      content: "";
      width: 6px;
      height: 6px;
      background: var(--accent-green-glow);
      border-radius: 50%;
      display: inline-block;
      animation: pulseGlow 1.5s infinite;
    }

    .stats {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 1.25rem;
      padding: 0.7rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 8px 15px -6px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }

    .stat-card .label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .stat-card .value {
      font-size: 1.7rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--text-primary);
      font-feature-settings: "tnum";
    }

    .stat-card.available .value { color: var(--accent-green-glow); }
    .stat-card.occupied .value { color: var(--accent-red-glow); }
    .stat-card.total .value { color: #60a5fa; }

    /* ---------- SEAT GRID ---------- */
    .seats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      margin: 2rem 0 1.5rem;
    }

    .seat-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border-radius: 1.75rem;
      padding: 1.6rem 0.8rem 1.3rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      position: relative;
      box-shadow: 0 12px 20px -12px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
    }

    .seat-card .badge {
      position: absolute;
      top: -8px;
      right: 14px;
      background: #0f172a;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 0.18rem 0.8rem;
      border-radius: 40px;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .seat-card .icon {
      font-size: 2.1rem;
      line-height: 1;
      margin-bottom: 0.25rem;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
    }

    .seat-card .name {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .seat-card .status {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* Occupied state */
    .seat-card.occupied {
      border-color: rgba(239, 68, 68, 0.6);
      background: linear-gradient(145deg, #1a1f2e, #1e1a28);
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.2) inset, 0 12px 20px -12px #000, 0 0 25px rgba(239, 68, 68, 0.25);
      transform: translateY(-2px);
    }

    .seat-card.occupied .status {
      color: var(--accent-red-glow);
      text-shadow: 0 0 12px rgba(248, 113, 113, 0.5);
    }

    .seat-card.occupied .icon {
      color: var(--accent-red);
      filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.4));
    }

    /* Vacant state */
    .seat-card.vacant {
      border-color: rgba(16, 185, 129, 0.5);
      background: linear-gradient(145deg, #111c1e, #0e1a1a);
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.15) inset, 0 12px 20px -12px #000, 0 0 25px rgba(16, 185, 129, 0.15);
      transform: translateY(-2px);
    }

    .seat-card.vacant .status {
      color: var(--accent-green-glow);
      text-shadow: 0 0 12px rgba(52, 211, 153, 0.4);
    }

    .seat-card.vacant .icon {
      color: var(--accent-green);
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.3));
    }

    /* ---------- FOOTER ---------- */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 500;
    }

    .conn-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #64748b;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .conn-dot.online {
      background: var(--accent-green-glow);
      box-shadow: 0 0 12px var(--accent-green-glow);
    }

    .conn-dot.offline {
      background: var(--accent-red-glow);
      box-shadow: 0 0 12px var(--accent-red-glow);
    }

    .timestamp {
      font-family: 'Inter', monospace;
      background: rgba(15, 23, 42, 0.8);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      letter-spacing: 0.2px;
      font-feature-settings: "tnum";
      color: var(--text-secondary);
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 750px) {
      .dashboard { padding: 1.5rem; border-radius: 2rem; }
      .header { flex-direction: column; align-items: flex-start; }
      .brand h1 { font-size: 1.6rem; }
      .stats { width: 100%; justify-content: space-between; }
      .stat-card { padding: 0.6rem 1rem; flex: 1; min-width: 90px; }
      .stat-card .value { font-size: 1.4rem; }
      .seats-grid { grid-template-columns: repeat(2, 1fr); gap: 0.9rem; }
      .seat-card .icon { font-size: 1.8rem; }
      .seat-card .status { font-size: 1rem; }
    }

    @media (max-width: 420px) {
      .stats { flex-wrap: wrap; }
      .stat-card { flex: 1 1 40%; }
      .seats-grid { grid-template-columns: 1fr; }
      .footer { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="dashboard">
  <!-- HEADER -->
  <div class="header">
    <div class="brand">
      <h1>
        <span class="pulse-dot"></span> Smart Library
      </h1>
      <div class="sub">
        <span>Seat occupancy · real‑time</span>
        <span class="live-tag">LIVE</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat-card available">
        <div class="label">Available</div>
        <div class="value" id="availableValue">—</div>
      </div>
      <div class="stat-card occupied">
        <div class="label">Occupied</div>
        <div class="value" id="occupiedValue">—</div>
      </div>
      <div class="stat-card total">
        <div class="label">Total</div>
        <div class="value" id="totalValue">4</div>
      </div>
    </div>
  </div>

  <!-- SEAT CARDS -->
  <div class="seats-grid" id="seatsGrid">
    <!-- Seat 1 -->
    <div class="seat-card" id="seat1Card">
      <div class="badge">S1</div>
      <div class="icon">🪑</div>
      <div class="name">Seat 1</div>
      <div class="status" id="seat1Status">—</div>
    </div>
    <!-- Seat 2 -->
    <div class="seat-card" id="seat2Card">
      <div class="badge">S2</div>
      <div class="icon">🪑</div>
      <div class="name">Seat 2</div>
      <div class="status" id="seat2Status">—</div>
    </div>
    <!-- Seat 3 -->
    <div class="seat-card" id="seat3Card">
      <div class="badge">S3</div>
      <div class="icon">🪑</div>
      <div class="name">Seat 3</div>
      <div class="status" id="seat3Status">—</div>
    </div>
    <!-- Seat 4 -->
    <div class="seat-card" id="seat4Card">
      <div class="badge">S4</div>
      <div class="icon">🪑</div>
      <div class="name">Seat 4</div>
      <div class="status" id="seat4Status">—</div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="connection">
      <span class="conn-dot" id="connectionDot"></span>
      <span id="connectionText">Connecting to Firebase…</span>
    </div>
    <div class="timestamp" id="lastUpdate">—</div>
  </div>
</div>

<script>
  (function () {
    // ================================================================
    // 1. FIREBASE CONFIG (matches ESP32 code)
    // ================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDZ0Yn5ghQhCGixSs_j6hpz9_1-hjJvc3k",
      databaseURL: "https://occupancy-monitoring-25640-default-rtdb.asia-southeast1.firebasedatabase.app",
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // ================================================================
    // 2. DOM REFERENCES
    // ================================================================
    const seatCards = {
      1: document.getElementById('seat1Card'),
      2: document.getElementById('seat2Card'),
      3: document.getElementById('seat3Card'),
      4: document.getElementById('seat4Card'),
    };

    const seatStatuses = {
      1: document.getElementById('seat1Status'),
      2: document.getElementById('seat2Status'),
      3: document.getElementById('seat3Status'),
      4: document.getElementById('seat4Status'),
    };

    const availableValue = document.getElementById('availableValue');
    const occupiedValue = document.getElementById('occupiedValue');
    const totalValue = document.getElementById('totalValue');
    const connectionDot = document.getElementById('connectionDot');
    const connectionText = document.getElementById('connectionText');
    const lastUpdate = document.getElementById('lastUpdate');

    // ================================================================
    // 3. STATE (mirrors Firebase data)
    // ================================================================
    let state = {
      seat1: 0,
      seat2: 0,
      seat3: 0,
      seat4: 0,
      occupied: 0,
      available: 4,
      totalSeats: 4,
    };

    // ================================================================
    // 4. RENDER FUNCTION (with smooth class transitions)
    // ================================================================
    function render() {
      // --- Update each seat card ---
      for (let i = 1; i <= 4; i++) {
        const key = 'seat' + i;
        const val = state[key];   // 0 = vacant, 1 = occupied
        const card = seatCards[i];
        const statusEl = seatStatuses[i];

        // Remove both states first
        card.classList.remove('occupied', 'vacant');

        if (val === 1) {
          card.classList.add('occupied');
          statusEl.textContent = 'OCCUPIED';
        } else {
          card.classList.add('vacant');
          statusEl.textContent = 'VACANT';
        }
      }

      // --- Summary stats ---
      availableValue.textContent = state.available ?? '—';
      occupiedValue.textContent = state.occupied ?? '—';
      totalValue.textContent = state.totalSeats ?? 4;

      // --- Timestamp ---
      const now = new Date();
      lastUpdate.textContent = now.toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
      });
    }

    // ================================================================
    // 5. FIREBASE LISTENERS
    // ================================================================
    const libraryRef = database.ref('library');

    // --- Connection monitor ---
    const connectedRef = database.ref('.info/connected');
    connectedRef.on('value', (snap) => {
      const connected = snap.val() === true;
      if (connected) {
        connectionDot.classList.add('online');
        connectionDot.classList.remove('offline');
        connectionText.textContent = 'Connected to Firebase';
      } else {
        connectionDot.classList.add('offline');
        connectionDot.classList.remove('online');
        connectionText.textContent = 'Disconnected from Firebase';
      }
    });

    // --- Main data listener ---
    libraryRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        connectionText.textContent = 'Waiting for device data…';
        return;
      }

      // Merge incoming data into state
      state.seat1 = data.seat1 ?? 0;
      state.seat2 = data.seat2 ?? 0;
      state.seat3 = data.seat3 ?? 0;
      state.seat4 = data.seat4 ?? 0;
      state.occupied = data.occupied ?? 0;
      state.available = data.available ?? 4;
      state.totalSeats = data.totalSeats ?? 4;

      render();
    }, (error) => {
      console.error('Firebase read error:', error);
      connectionText.textContent = 'Error reading database';
      connectionDot.classList.add('offline');
      connectionDot.classList.remove('online');
    });

    // Initial render
    render();

    // Keep timestamp fresh every 20s even without data change
    setInterval(() => {
      if (connectionDot.classList.contains('online')) {
        const now = new Date();
        lastUpdate.textContent = now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
        });
      }
    }, 20000);

  })();
</script>
</body>
</html>
